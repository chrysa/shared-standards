[project]
name = "standards-console"
version = "0.1.0"
description = "Local management console for the chrysa shared standards fleet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "ruamel.yaml>=0.18",
    "mcp>=1.6,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
standards-console = "standards_console.__main__:main"
standards-mcp = "standards_console.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["standards_console"]

[tool.ruff]
extend-exclude = [".claude", "scripts/quality_gate.py"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "C901", "PERF203", "PERF401", "PLR0402", "PLR0911", "PLR0912", "PLR0915", "PLR1714", "PLR1730", "PLR5501", "RUF005", "RUF006", "RUF007", "RUF009", "RUF012", "RUF013", "RUF022", "RUF043", "RUF059", "RUF100", "PLR2004"]
# B008: FastAPI's `Depends(...)` in defaults is the idiomatic DI pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 85

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004"]
"**/test_*.py" = ["PLR2004"]
"**/conftest.py" = ["PLR2004"]
