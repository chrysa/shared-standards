default_language_version:
  python: python3.14
fail_fast: false
minimum_pre_commit_version: 4.1.0
repos:
- hooks:
  - id: check-json
  - exclude: ^.github/ISSUE_TEMPLATE/
    id: check-yaml
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: detect-private-key
  - args:
    - --branch
    - main
    id: no-commit-to-branch
  repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
- hooks:
  - args:
    - --fix
    id: markdownlint
    stages:
    - manual
  repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.48.0
- hooks:
  - id: makefile-check
  # --- generic (all repos) ---
  - exclude: ^(\.github/|workflows/|templates/)
    id: yaml-sorter
  - id: json-sorter
  - id: env-file-check
  - id: env-example-sync
  - id: adr-gate
  # TODO: add detect-duplicated-copilot-instructions after chrysa/pre-commit-tools#163 is merged and released
  # --- python (all Python repos) ---
  - id: debugger-detection
  - id: python-print-detection
  - id: python-pprint-detection
    exclude: 'tests?/'
  - id: no-bare-except
  - id: python-logger-detection
  - id: python-unreachable-code
  - id: no-hardcoded-localhost
    exclude: 'tests?/|\.test\.|\.spec\.'
  - id: regression-gate
    stages: [pre-push]
  # --- fastapi (FastAPI repos only — remove if not applicable) ---
  - id: fastapi-missing-response-model
    exclude: '^tests/'
  - id: fastapi-missing-links
    exclude: '^tests/'
  - id: no-sync-in-async
  # --- docker (repos with Dockerfiles — remove if not applicable) ---
  - id: dockerfile-no-latest
  # --- js/ts (JS/TS repos — remove if not applicable) ---
  - id: console-log-detection
  - id: console-debug-detection
  - id: react-console-error-detection
  - id: no-console-warn
  - id: ts-unreachable-code
  - id: import-no-relative-parent
  # --- react (React repos only — remove if not applicable) ---
  - id: react-no-async-in-useeffect
  - id: react-direct-dom
  repo: https://github.com/chrysa/pre-commit-tools
  rev: v0.1.1-94
- hooks:
  - id: gitleaks
  repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.0
- hooks:
  - id: conventional-pre-commit
    stages: [commit-msg]
    args: [feat, fix, docs, style, refactor, test, chore, perf, revert, ci]
  repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
- hooks:
  # Canonical-file drift gate (dedup-campaign #108 GitVersion, #109 cliff): the
  # repo-root source of truth must stay byte-identical to its templates/ copy
  # that the distribution machinery hands the fleet.
  - id: gitversion-canonical-drift
    name: GitVersion.yml canonical drift
    entry: scripts/check-canonical-drift.sh GitVersion.yml templates/GitVersion.yml
    language: system
    pass_filenames: false
    files: ^(GitVersion\.yml|templates/GitVersion\.yml)$
  - id: cliff-canonical-drift
    name: cliff.toml canonical drift
    entry: scripts/check-canonical-drift.sh cliff.toml templates/cliff.toml
    language: system
    pass_filenames: false
    files: ^(cliff\.toml|templates/cliff\.toml)$
  repo: local
