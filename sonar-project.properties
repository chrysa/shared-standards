sonar.projectKey=chrysa_shared-standards
sonar.organization=chrysa
sonar.projectName=shared-standards
sonar.sourceEncoding=UTF-8
# sonar.sources / sonar.tests are owned by the CI sonar job (ci.yml), which passes
# -Dsonar.sources to keep a single, consistent analysis. Do not set them here too.
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/.mypy_cache/**,**/web_dist/**,**/node_modules/**
# Vitest files sit next to the code they test (console/web/src/**/*.test.ts[x]) and are therefore
# inside sonar.sources. They are still analysed for issues, but test code is never a line to cover:
# counting it made every added test lower the new-code coverage of the product code.
sonar.coverage.exclusions=console/web/src/**/*.test.ts,console/web/src/**/*.test.tsx,console/web/src/test/**
