sonar.projectKey=chrysa_shared-standards
sonar.organization=chrysa
sonar.projectName=shared-standards
sonar.sourceEncoding=UTF-8
# sonar.sources / sonar.tests are owned by the CI sonar job (ci.yml), which passes
# -Dsonar.sources to keep a single, consistent analysis. Do not set them here too.
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/.mypy_cache/**,**/web_dist/**,**/node_modules/**
