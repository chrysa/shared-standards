[tool.pytest.ini_options]
addopts = "-p no:query_optimizer -p no:django"

[tool.ruff]
extend-exclude = [".claude", "scripts/quality_gate.py"]

[tool.ruff.lint]
select = [
    "C901",
    "PERF203",
    "PERF401",
    "PLR0402",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "PLR1714",
    "PLR1730",
    "PLR5501",
    "RUF005",
    "RUF006",
    "RUF007",
    "RUF009",
    "RUF012",
    "RUF013",
    "RUF022",
    "RUF043",
    "RUF059",
    "RUF100",
    "PLR2004",
    "T100",
    "T203",
    "E722",
    "B006",
    "LOG015",
    "ASYNC210",
    "ASYNC212",
    "ASYNC220",
    "ASYNC221",
    "ASYNC222",
    "ASYNC230",
    "ASYNC251",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004", "T203"]
"**/test_*.py" = ["PLR2004", "T203"]
"**/conftest.py" = ["PLR2004", "T203"]
