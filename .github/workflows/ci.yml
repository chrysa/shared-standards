---
# CI for shared-standards. This repo is a special case: its executable code lives in
# console/ (not at repo root), so the generic ci-python template does not fit. This file
# is therefore CANONICAL and hand-maintained — the standards sync (apply-repo-standard.sh)
# detects the `Pre-commit checks` + `SonarCloud` jobs via ci_is_canonical() and SKIPS it,
# so edits here survive the fleet sync. Do not reduce it below those two job names.
#
# Jobs:
#   Pre-commit checks — fast ruff + mypy lint (no heavy pre-commit stack).
#   Docker tests      — runs the console suite in Docker, emits repo-root coverage.xml.
#   Web coverage      — vitest lcov for console/web (TS), SF paths repo-root-relative.
#   SonarCloud        — single analysis over the real sources, consuming both the
#                       Python coverage.xml and the web TS lcov (shared-standards#183).

name: CI

on:
    pull_request:
        branches: [develop, main]
    push:
        branches:
            - develop
            - main
            - "feat/**"
            - "fix/**"
            - "chore/**"
            - "ci/**"
    workflow_dispatch:

permissions:
    checks: write
    contents: read
    pull-requests: write
    statuses: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    precommit:
        name: Pre-commit checks
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: console
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  enable-cache: true

            - name: Ruff + Mypy
              run: |
                  uv sync --extra dev
                  uv run ruff check .
                  uv run mypy standards_console

            # The agent views (slim CLAUDE.md core, standards/rules/<domain>.md, AGENTS.md,
            # .github/copilot-instructions.md) are generated from standards/STANDARDS.chrysa.md.
            # Regenerate and fail if any committed view drifted (mirrors the agent-views-drift
            # pre-commit hook). Runs from the repo root, off the console project.
            - name: Agent views drift
              working-directory: ${{ github.workspace }}
              run: uv run --no-project --with pyyaml==6.0.2 python -m scripts.gen_agent_views --check

    test:
        name: Docker tests
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7.0.1

            - name: Run tests via Docker
              run: make docker-test

            # Coverage is generated inside the test job; the sonar job runs on a
            # separate runner, so the report must travel as an artifact. The name
            # MUST be test-results-<python-version> — that is exactly what
            # sonar-scan-python downloads into reports/.
            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: test-results-3.14
                  path: coverage.xml
                  if-no-files-found: warn

            # The canonical scripts (quality_gate parser, pre-commit-merge) run as host
            # tools; test them on the host and ship their coverage to Sonar alongside the
            # console report so a scripts/ change is not counted as 0% new-code coverage.
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.14"

            - name: Scripts tests + coverage (host)
              run: |
                  python -m pip install --quiet pytest pytest-cov coverage ruamel.yaml \
                      presidio-analyzer==2.2.359 click==8.4.2 \
                      "fr_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl" \
                      "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"
                  make test-scripts

            - name: Upload scripts coverage
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: scripts-coverage
                  path: scripts-coverage.xml
                  if-no-files-found: warn

    web:
        name: Web coverage
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: console/web
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
              with:
                  version: 9

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: console/web/pnpm-lock.yaml

            # console/web ships a stub pnpm-workspace.yaml with no `packages:`
            # field; it is a single-package project (lockfile has `importers: .`),
            # so --ignore-workspace lets pnpm install it standalone.
            - name: Install deps
              run: pnpm install --frozen-lockfile --ignore-workspace

            - name: Vitest coverage (lcov)
              run: pnpm run --ignore-workspace test:cov

            # vitest emits SF paths relative to console/web (e.g. src/…). Sonar
            # matches lcov SF against files under sonar.sources (console/web/src),
            # so rewrite SF to repo-root-relative. Handles both absolute and
            # relative SF forms.
            - name: Rewrite LCOV SF paths to repo-root-relative
              run: |
                  sed -i -E 's#^SF:.*/(src/.*)$#SF:console/web/\1#; t; s#^SF:(src/.*)$#SF:console/web/\1#' coverage/lcov.info

            - name: Upload web LCOV coverage
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: web-coverage-lcov
                  path: console/web/coverage/lcov.info
                  if-no-files-found: warn

    sonar:
        name: SonarCloud
        if: ${{ github.actor != 'dependabot[bot]' }}
        needs: [test, web]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            pull-requests: read
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            # Web TS coverage travels from the `web` job as an artifact; land it
            # where the action expects it (js-coverage-report path below).
            # `sonar` needs `web`, which always uploads this artifact, so the download
            # cannot legitimately be absent — no continue-on-error (CI-037). If web ever
            # stops producing it, this failing loudly is correct, not something to swallow.
            - name: Download web LCOV coverage
              uses: actions/download-artifact@v8
              with:
                  name: web-coverage-lcov
                  path: console/web/coverage

            # Scripts coverage from the `test` job; land it in reports/ so it is passed to
            # Sonar next to the console coverage.xml the action downloads itself. `sonar`
            # needs `test`, which only reaches the upload after the scripts step passed, so
            # the artifact cannot legitimately be absent — no continue-on-error (CI-037).
            - name: Download scripts coverage
              uses: actions/download-artifact@v8
              with:
                  name: scripts-coverage
                  path: reports

            - uses: chrysa/github-actions/sonar-scan-python@v1.8.1
              with:
                  python-version: "3.14"
                  sonar-token: ${{ secrets.SONAR_TOKEN }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  project-key: chrysa_shared-standards
                  organization: chrysa
                  project-name: shared-standards
                  # Analyse the real code so the console coverage.xml maps (was
                  # `scripts` only, which never covered console/ → 0% coverage).
                  sources: console/standards_console,scripts,console/web/src
                  tests: console/tests
                  # console coverage.xml is downloaded from the test-results-3.14 artifact
                  # into reports/ by the action; scripts-coverage.xml is placed in reports/
                  # by the step above. reportPaths accepts a comma list.
                  coverage-report: reports/coverage.xml,reports/scripts-coverage.xml
                  # TS coverage from the `web` job (SF paths repo-root-relative).
                  # Missing file is skipped by the action, never fails the scan.
                  js-coverage-report: console/web/coverage/lcov.info
