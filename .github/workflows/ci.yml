---
# CI for shared-standards. This repo is a special case: its executable code lives in
# console/ (not at repo root), so the generic ci-python template does not fit. This file
# is therefore CANONICAL and hand-maintained — the standards sync (apply-repo-standard.sh)
# detects the `Pre-commit checks` + `SonarCloud` jobs via ci_is_canonical() and SKIPS it,
# so edits here survive the fleet sync. Do not reduce it below those two job names.
#
# Jobs:
#   Pre-commit checks — fast ruff + mypy lint (no heavy pre-commit stack).
#   Docker tests      — runs the console suite in Docker, emits repo-root coverage.xml.
#   Web coverage      — vitest lcov for console/web (TS), SF paths repo-root-relative.
#   SonarCloud        — single analysis over the real sources, consuming both the
#                       Python coverage.xml and the web TS lcov (shared-standards#183).

name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches:
            - main
            - "feat/**"
            - "fix/**"
            - "chore/**"
            - "ci/**"
    workflow_dispatch:

permissions:
    checks: write
    contents: read
    pull-requests: write
    statuses: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    precommit:
        name: Pre-commit checks
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: console
        steps:
            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true

            - name: Ruff + Mypy
              run: |
                  uv sync --extra dev
                  uv run ruff check .
                  uv run mypy standards_console

    test:
        name: Docker tests
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - name: Run tests via Docker
              run: make docker-test

            # Coverage is generated inside the test job; the sonar job runs on a
            # separate runner, so the report must travel as an artifact. The name
            # MUST be test-results-<python-version> — that is exactly what
            # sonar-scan-python downloads into reports/.
            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: test-results-3.14
                  path: coverage.xml
                  if-no-files-found: warn

    web:
        name: Web coverage
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: console/web
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v4
              with:
                  version: 9

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: console/web/pnpm-lock.yaml

            - name: Install deps
              run: pnpm install --frozen-lockfile

            - name: Vitest coverage (lcov)
              run: pnpm test:cov

            # vitest emits SF paths relative to console/web (e.g. src/…). Sonar
            # matches lcov SF against files under sonar.sources (console/web/src),
            # so rewrite SF to repo-root-relative. Handles both absolute and
            # relative SF forms.
            - name: Rewrite LCOV SF paths to repo-root-relative
              run: |
                  sed -i -E 's#^SF:.*/(src/.*)$#SF:console/web/\1#; t; s#^SF:(src/.*)$#SF:console/web/\1#' coverage/lcov.info

            - name: Upload web LCOV coverage
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: web-coverage-lcov
                  path: console/web/coverage/lcov.info
                  if-no-files-found: warn

    sonar:
        name: SonarCloud
        if: ${{ github.actor != 'dependabot[bot]' }}
        needs: [test, web]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            pull-requests: read
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            # Web TS coverage travels from the `web` job as an artifact; land it
            # where the action expects it (js-coverage-report path below).
            - name: Download web LCOV coverage
              continue-on-error: true
              uses: actions/download-artifact@v7
              with:
                  name: web-coverage-lcov
                  path: console/web/coverage

            - uses: chrysa/github-actions/sonar-scan-python@v1.4.0
              with:
                  python-version: "3.14"
                  sonar-token: ${{ secrets.SONAR_TOKEN }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  project-key: chrysa_shared-standards
                  organization: chrysa
                  project-name: shared-standards
                  # Analyse the real code so the console coverage.xml maps (was
                  # `scripts` only, which never covered console/ → 0% coverage).
                  sources: console/standards_console,scripts,console/web/src
                  tests: console/tests
                  # Downloaded from the test-results-3.14 artifact into reports/
                  # by the action; matches sonar-scan-python's default path.
                  coverage-report: reports/coverage.xml
                  # TS coverage from the `web` job (SF paths repo-root-relative).
                  # Missing file is skipped by the action, never fails the scan.
                  js-coverage-report: console/web/coverage/lcov.info
