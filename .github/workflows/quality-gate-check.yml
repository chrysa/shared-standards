---
name: Quality Gate Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  checks: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: No-Regression Quality Gates

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      # Only when the repo actually has a Node project — the "if needed" made explicit
      # with a guard instead of swallowing every setup failure with continue-on-error (CI-037).
      - name: Set up Node.js (if needed)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f package.json ]; then npm ci; fi

      - name: Run quality gate verification
        id: quality-gate
        run: |
          if [ ! -f ".quality-gate-baseline.json" ]; then
            echo "⚠️  No baseline found — skipping quality gate (run make quality-gate-baseline to set up)"
            exit 0
          fi
          make quality-gate-verify

      - name: Report quality gate status
        if: always()
        run: |
          if [ "${{ steps.quality-gate.outcome }}" == 'success' ]; then
            echo "✅ All quality gates passed"
            exit 0
          else
            echo "❌ Quality gate regression detected"
            exit 1
          fi
