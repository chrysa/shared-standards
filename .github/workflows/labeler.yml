---
name: PR Labeler

on:
    pull_request_target:
        types: [opened, reopened, synchronize]

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    labeler:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        name: Label PR

        steps:
            - uses: actions/labeler@v7
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
