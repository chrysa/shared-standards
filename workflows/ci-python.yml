true:
  pull_request:
    branches:
    - main
    - master
  push:
    branches:
    - main
    - master
  workflow_call:
    inputs:
      coverage-report:
        default: coverage.xml
        description: Path to coverage.xml file (empty = skip upload)
        required: false
        type: string
      install-extras:
        default: dev
        description: "pip extras to install (e.g. 'dev' \u2192 pip install -e \".[dev]\"\
          )"
        required: false
        type: string
      python-version:
        default: '3.12'
        description: Python version to use
        required: false
        type: string
jobs:
  lint:
    name: Lint & pre-commit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version || '3.12' }}
    - name: Run pre-commit hooks
      uses: pre-commit/action@v3.0.1
  test:
    name: Tests & coverage
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version || '3.12' }}
    - name: Install dependencies
      run: pip install -e ".[${inputs.install-extras || 'dev'}]"
    - name: Run pytest
      run: pytest --tb=short --cov --cov-report=xml
    - if: ${{ inputs.coverage-report != '' }}
      name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        fail_ci_if_error: false
        files: ${{ inputs.coverage-report || 'coverage.xml' }}
name: CI Python
permissions:
  contents: read
