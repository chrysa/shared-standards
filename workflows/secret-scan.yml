true:
  pull_request:
    branches:
    - main
    - master
  push:
    branches:
    - main
    - master
  workflow_call:
    inputs:
      config-path:
        default: ''
        description: Path to .gitleaks.toml config file (optional)
        required: false
        type: string
      fail-on-leak:
        default: true
        description: Fail the workflow if a secret is detected
        required: false
        type: boolean
    secrets:
      GITLEAKS_LICENSE:
        required: false
jobs:
  gitleaks:
    name: Detect secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      name: Run gitleaks
      uses: gitleaks/gitleaks-action@v2
      with:
        config-path: ${{ inputs.config-path != '' && inputs.config-path || '' }}
        fail: ${{ inputs.fail-on-leak != false }}
name: Secret Scanning
permissions:
  contents: read
