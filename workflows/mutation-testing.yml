---
# Mutation testing workflow template (chrysa ecosystem)
#
# Usage: copy to .github/workflows/mutation-testing.yml and set the default
# paths. The job itself lives in chrysa/github-actions (mutation-testing.yml),
# which runs mutmut 3: there is nothing to maintain in the consumer repository.
#
# Inputs of the shared workflow (all optional):
#   paths              comma-separated paths to mutate (ignored when
#                      the repo already configures mutmut)
#   threshold          minimum mutation score, 0-100 (default 70)
#   python-version     default "3.14"
#   working-directory  folder holding pyproject.toml (default ".")
#   test-paths         comma-separated pytest paths (default: pytest discovery)
#   install-command    default: pip install -e ".[dev]"
#
# Designed for weekly schedule runs, NOT PR gates.

name: Mutation Testing

on:
    schedule:
        - cron: "0 3 * * 1"
    workflow_dispatch:
        inputs:
            paths:
                description: "Comma-separated paths to mutate (default: src/)"
                required: false
                default: "src/"
            threshold:
                description: "Minimum mutation score (0-100)"
                required: false
                default: "70"

permissions:
    contents: read

jobs:
    mutation:
        uses: chrysa/github-actions/.github/workflows/mutation-testing.yml@v1.11.2
        with:
            paths: ${{ inputs.paths || 'src/' }}
            threshold: ${{ inputs.threshold || '70' }}
