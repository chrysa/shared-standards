---
# Canonical CI workflow for Node.js / TypeScript projects (chrysa ecosystem).
#
# Usage: copy to .github/workflows/ci.yml. The applier
# (scripts/apply-repo-standard.sh) substitutes the ${...} placeholders:
#   ${SOURCES}      source dir for sonar              (e.g. src)
#   ${REPO_NAME}    repo name                         (e.g. container-webview)
#   ${PROJECT_KEY}  SonarCloud project key            (e.g. chrysa_container-webview)
#
# ⚠️ This file lives in workflows/ (NOT .github/workflows/) — it is a copy-to-use
#    template, not a reusable `uses:` workflow.
#
# Job names (pre-commit / lint / test / sonar) are the branch-protection
# required status checks — keep them stable across repos (parity with ci-python.yml).
#
# The test job must produce coverage/lcov.info and upload it as the
# `coverage-lcov` artifact, which sonar-scan-node consumes.

name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches:
            - main
            - "feat/**"
            - "fix/**"
            - "chore/**"
            - "ci/**"
    workflow_dispatch:

permissions:
    checks: write
    contents: read
    pull-requests: write
    statuses: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    pre-commit:
        name: Pre-commit checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.14"
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
            - run: npm ci
            - uses: pre-commit/action@v3.0.1
              env:
                  SKIP: no-commit-to-branch

    lint:
        name: Lint + Typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
            - run: npm ci
            - name: Lint
              run: npm run lint
            - name: Typecheck
              run: npm run type-check

    test:
        name: Tests
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
            - run: npm ci
            - name: Run tests with coverage
              run: npm run test:coverage
            - name: Upload coverage
              uses: actions/upload-artifact@v8
              with:
                  name: coverage-lcov
                  path: coverage/lcov.info
                  if-no-files-found: warn

    sonar:
        name: SonarCloud
        if: ${{ github.actor != 'dependabot[bot]' }}
        needs: test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            pull-requests: read
        steps:
            - uses: actions/checkout@v6.0.2
              with:
                  fetch-depth: 0
            - uses: chrysa/github-actions/sonar-scan-node@v1.0.12
              with:
                  sonar-token: ${{ secrets.SONAR_TOKEN }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  project-key: ${PROJECT_KEY}
                  organization: chrysa
                  project-name: ${REPO_NAME}
                  sources: ${SOURCES}
